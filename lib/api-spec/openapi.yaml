openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: channel3
    description: Channel3 product search proxy
  - name: raete
    description: RAETE explanation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /channel3/search:
    get:
      operationId: searchChannel3Products
      tags: [channel3]
      summary: Search products through Channel3
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Up to eight Channel3 product results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel3SearchResults"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Channel3 search failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Channel3 API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Channel3 search timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /raete/explanation:
    post:
      operationId: generateRaeteExplanation
      tags: [raete]
      summary: Explain a deterministic RAETE ranking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaeteExplanationInput"
      responses:
        "200":
          description: Grounded explanation for the current deterministic winner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaeteExplanation"
        "400":
          description: Invalid explanation inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: AI explanation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    RaeteExplanationInput:
      type: object
      additionalProperties: false
      required: [productName, productFacts, priorities, dimensions]
      properties:
        productName:
          type: string
          minLength: 1
          maxLength: 250
        brand:
          type: ["string", "null"]
          maxLength: 160
        productFacts:
          $ref: "#/components/schemas/RaeteProductFacts"
        priorities:
          $ref: "#/components/schemas/RaetePriorities"
        dimensions:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/RaeteDimension"
        aheadOfSecond:
          type: ["string", "null"]
          maxLength: 500
    RaeteProductFacts:
      type: object
      additionalProperties: false
      properties:
        price:
          type: ["string", "null"]
          maxLength: 80
        merchant:
          type: ["string", "null"]
          maxLength: 160
        condition:
          type: ["string", "null"]
          maxLength: 120
        availability:
          type: ["string", "null"]
          maxLength: 120
    RaetePriorities:
      type: object
      additionalProperties: false
      required: [materials, quality, price, longevity]
      properties:
        materials:
          type: string
          enum: [low, medium, high]
        quality:
          type: string
          enum: [low, medium, high]
        price:
          type: string
          enum: [low, medium, high]
        longevity:
          type: string
          enum: [low, medium, high]
    RaeteDimension:
      type: object
      additionalProperties: false
      required: [name, priority, score, weight, provenance]
      properties:
        name:
          type: string
          enum: [Materials, Quality, Price, Longevity]
        priority:
          type: string
          enum: [low, medium, high]
        score:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        weight:
          type: integer
          minimum: 1
          maximum: 3
        provenance:
          type: string
          enum: [prototype, channel3]
    RaeteExplanation:
      type: object
      additionalProperties: false
      required: [explanation]
      properties:
        explanation:
          type: string
          minLength: 1
          maxLength: 500
    Channel3SearchResults:
      type: object
      required: [products]
      properties:
        products:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Channel3Product"
    Channel3Product:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Channel3Brand"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Channel3Image"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Channel3Offer"
    Channel3Brand:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Channel3Image:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        cleaned_url:
          type: ["string", "null"]
          format: uri
        is_main_image:
          type: boolean
        alt_text:
          type: ["string", "null"]
    Channel3Offer:
      type: object
      required: [url, domain]
      properties:
        url:
          type: string
          format: uri
        domain:
          type: string
        price:
          $ref: "#/components/schemas/Channel3Price"
        availability:
          type: ["string", "null"]
        condition:
          type: ["string", "null"]
    Channel3Price:
      type: object
      properties:
        price:
          type: number
        amount:
          type: number
        currency:
          type: string
        compare_at_price:
          type: ["number", "null"]
